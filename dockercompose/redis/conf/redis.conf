bind 0.0.0.0
protected-mode yes
port 6379

# 持久化：开启 AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB 快照（保留默认策略即可，按需调整）
save 900 1
save 300 10
save 60 10000

# 日志
logfile /var/log/redis/redis.log
loglevel notice

# 内存策略（按实际内存调整）
maxmemory 256mb
maxmemory-policy allkeys-lru